const d=JSON.parse(document.getElementById('data').textContent),el=id=>document.getElementById(id),put=(id,s)=>el(id).textContent=s;

const premium=m=>m.offers.every(o=>o!==null)&&m.offers[0].amount>0?(m.offers[1].amount/m.offers[0].amount-1)*100:null;
const fmt=(v,m)=>new Intl.NumberFormat('en-US',{style:'currency',currency:m.currency,currencyDisplay:'narrowSymbol',minimumFractionDigits:Number.isInteger(v)?0:undefined,maximumFractionDigits:2}).format(v);
const price=(o,m)=>o?fmt(o.amount,m):'Unverified';

document.title=d.product+' | '+d.season+' · Nstdata Crawl';put('date',d.observed);put('season',d.season);put('product',d.product);put('subtitle',d.subtitle);put('num',d.markets.length+' stores');put('promo',d.promotion);put('base',d.editions[0]);put('up',d.editions[1]);put('hint','Select a market to open its local prices and store evidence.');put('note',d.note);
const percentages=d.markets.map(premium).filter(x=>x!==null);

function draw(){document.querySelector('.tablebox').classList.toggle('ranking',sort==='rank');const scaleMax=Math.max(10,Math.ceil(Math.max(...percentages,0)/10)*10);put('scaleMax',scaleMax+'%');const sorted=[...d.markets];if(sort==='rank')sorted.sort((a,b)=>(premium(b)??-Infinity)-(premium(a)??-Infinity));el('rows').replaceChildren();for(const m of sorted){const b=field('button','row market','');b.dataset.code=m.code;b.setAttribute('aria-label','View '+m.name+' prices');const name=field('span','name','');name.append(field('span','code',m.code),document.createTextNode(m.name));const v=premium(m),metric=field('span','metric',pct(v)),bar=field('span','bar',''),fill=document.createElement('i');fill.style.width=(v===null?0:Math.max(0,v)/Math.max(...percentages,1)*100)+'%';bar.append(fill);metric.append(bar);const plot=field('span','rankPlot',''),seg=document.createElement('i');seg.style.width=(v==null?0:Math.max(0,v)/scaleMax*100)+'%';plot.append(seg);b.append(name,field('span','money',price(m.offers[0],m)),field('span','money',price(m.offers[1],m)),plot,metric,field('span','','›'));b.onclick=()=>{select(m);if(matchMedia('(max-width:720px)').matches)document.querySelector('aside').scrollIntoView({block:'center'});};el('rows').append(b)}el('geo').setAttribute('aria-pressed',String(sort==='geo'));el('rank').setAttribute('aria-pressed',String(sort==='rank'));select(active)}
el('geo').onclick=()=>{sort='geo';draw()};el('rank').onclick=()=>{sort='rank';draw()};draw();
const studio = el('studio');

put('studio-context', d.store + ' · ' + d.observed);
if (d.art) el('studio-art').src = d.art;
else el('studio-art').hidden = true;
const rankedMarkets = [...d.markets].sort((a,b) => (premium(b) ?? -Infinity) - (premium(a) ?? -Infinity));
const choices = [rankedMarkets[0], rankedMarkets.filter(m => premium(m) !== null).at(-1)];
if (!choices[1] || choices[1] === choices[0]) choices[1] = rankedMarkets.at(-1);
function drawPair() {
  el('receipts-body').replaceChildren();
  choices.forEach((market, index) => {
    const panel = el('panel-' + index);
    const picker = panel.querySelector('select');
    picker.value = market.code;
    for (const option of picker.options) option.disabled = option.value === choices[1-index].code;
    const [standard, ultimate] = market.offers;
    const gap = standard && ultimate ? Math.round((ultimate.amount-standard.amount)*100)/100 : null;
    panel.querySelector('strong').textContent = gap === null ? '—' : (gap >= 0 ? '+' : '') + fmt(gap,market);
    panel.querySelector('p').textContent = premium(market) === null ? 'Premium unverified' : pct(premium(market))+' over '+d.editions[0]+' · '+market.currency;
    const pair = panel.querySelector('.edition-pair');
    pair.replaceChildren();
    const evidence = field('div','','');
    evidence.append(field('b','',market.name));
    market.offers.forEach((offer,i) => {
      const quote = field('div','','');
      quote.append(field('span','',d.editions[i]),field('b','',price(offer,market)));
      pair.append(quote);
      if (offer) {
        const link = field('a','',d.editions[i]+' ↗');

  else {

  }
}
const start = el('compare-pair');

if (!start.hidden) {
  choices.forEach((m,i) => {
    const panel=field('section','market-panel',''); panel.id='panel-'+i;
    const picker=document.createElement('select'); picker.setAttribute('aria-label',i?'Second market':'First market');

    panel.append(picker,field('strong','',''),field('p','',''),field('div','edition-pair',''));el('match').append(panel);
