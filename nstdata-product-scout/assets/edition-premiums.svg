<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 390" role="img" aria-labelledby="title desc">
  <title id="title">GTA VI edition upgrade by market</title>
  <desc id="desc">Extra cost of Ultimate relative to Standard on PS5, measured in each store's own currency on 24 November 2026. UK 28.6%, Brazil 22.2%.</desc>
  <rect width="840" height="390" rx="16" fill="#141b34"/>
  <g font-family="system-ui, sans-serif">
    <text x="30" y="43" font-size="25" font-weight="700" fill="#fff">GTA VI · Ultimate edition premium</text>
    <text x="30" y="70" font-size="15" fill="#c4cee3">PlayStation Store · PS5 · 24 Nov 2026</text>
    <line x1="195" y1="98" x2="195" y2="349" stroke="#414d67"/>
    <text x="195" y="371" font-size="14" fill="#c4cee3" text-anchor="middle">0%</text>
    <line x1="375" y1="98" x2="375" y2="349" stroke="#414d67"/>
    <text x="375" y="371" font-size="14" fill="#c4cee3" text-anchor="middle">10%</text>
    <line x1="555" y1="98" x2="555" y2="349" stroke="#414d67"/>
    <text x="555" y="371" font-size="14" fill="#c4cee3" text-anchor="middle">20%</text>
    <line x1="735" y1="98" x2="735" y2="349" stroke="#414d67"/>
    <text x="735" y="371" font-size="14" fill="#c4cee3" text-anchor="middle">30%</text>
    <text x="30" y="118" font-size="16" fill="#edf1fc">United Kingdom</text>
    <rect x="195" y="106" width="514.36" height="14" rx="4" fill="#9ce9de"/>
    <text x="718.4" y="118" font-size="15" fill="#fff">28.6%</text>
    <text x="30" y="150" font-size="16" fill="#edf1fc">Canada</text>
    <rect x="195" y="138" width="490.95" height="14" rx="4" fill="#92aaff"/>
    <text x="695.0" y="150" font-size="15" fill="#fff">27.3%</text>
    <text x="30" y="182" font-size="16" fill="#edf1fc">Japan</text>
    <rect x="195" y="170" width="455.51" height="14" rx="4" fill="#92aaff"/>
    <text x="659.5" y="182" font-size="15" fill="#fff">25.3%</text>
    <text x="30" y="214" font-size="16" fill="#edf1fc">India</text>
    <rect x="195" y="202" width="450.08" height="14" rx="4" fill="#92aaff"/>
    <text x="654.1" y="214" font-size="15" fill="#fff">25.0%</text>
    <text x="30" y="246" font-size="16" fill="#edf1fc">United States</text>
    <rect x="195" y="234" width="450.06" height="14" rx="4" fill="#92aaff"/>
    <text x="654.1" y="246" font-size="15" fill="#fff">25.0%</text>
    <text x="30" y="278" font-size="16" fill="#edf1fc">Germany</text>
    <rect x="195" y="266" width="450.06" height="14" rx="4" fill="#92aaff"/>
    <text x="654.1" y="278" font-size="15" fill="#fff">25.0%</text>
    <text x="30" y="310" font-size="16" fill="#edf1fc">Australia</text>
    <rect x="195" y="298" width="415.54" height="14" rx="4" fill="#92aaff"/>
    <text x="619.5" y="310" font-size="15" fill="#fff">23.1%</text>
    <text x="30" y="342" font-size="16" fill="#edf1fc">Brazil</text>
    <rect x="195" y="330" width="400.09" height="14" rx="4" fill="#92aaff"/>
    <text x="604.1" y="342" font-size="15" fill="#fff">22.2%</text>
  </g>
</svg>
