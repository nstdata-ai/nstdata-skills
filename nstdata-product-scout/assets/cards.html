<!doctype html><html lang="$locale"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>$title · Nstdata Crawl</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f0ec;color:#191822;font:16px/1.45 Inter,"Helvetica Neue",Arial,sans-serif}header,main{max-width:1280px;margin:auto;padding-inline:clamp(18px,4vw,60px)}header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:20px;border-bottom:1px solid #c8c6c4}header strong{font-size:19px;letter-spacing:-.05em}header strong::before{content:"";display:inline-block;width:.55em;height:.8em;transform:skew(-18deg);background:#6a42ed;margin-right:.45em;vertical-align:-.03em}time{font:12px/1.35 ui-monospace,monospace;color:#565563}main{padding-bottom:32px}.headline{margin:28px 0 22px}h1,h2,h3,p,figure{margin:0}h1{font-size:clamp(32px,4.3vw,68px);line-height:1.04;letter-spacing:-.055em;text-wrap:balance}.headline p,.note{color:#51505f;margin-top:9px}.hero,.offer,.empty{border-radius:20px;overflow:hidden}.hero{background:radial-gradient(ellipse at 86% 32%,#3b364c 0%,#25222f 32%,#16151d 74%);color:#fcf9f7;display:flex;align-items:center;min-height:330px;padding:clamp(22px,3.5vw,50px);gap:3%}.copy{flex:1;min-width:0}.hero figure{width:49%;margin:0;transform:rotate(-6deg)}img{display:block;width:100%;object-fit:contain}.hero img{height:clamp(120px,21vw,280px);filter:drop-shadow(0 18px 12px #08080a88)}.pick{color:#d1beff;font:600 13px/1.4 ui-monospace,monospace;margin-bottom:10px}.hero h2{font-size:clamp(27px,3.2vw,48px);line-height:1.05;letter-spacing:-.04em}.variant{font-size:14px;color:#696572;margin-top:6px}.hero .variant{color:#cbc6d2}.price{display:flex;align-items:baseline;gap:.45em;flex-wrap:wrap;margin:12px 0 5px}.price b{font-size:32px;line-height:1;letter-spacing:-.07em;font-variant-numeric:tabular-nums}.hero .price b{font-size:clamp(50px,6.1vw,96px)}.price span{font:600 12px ui-monospace,monospace}.price small{color:#696572;font-size:12px}.hero .price small{color:#cdc6d9}.stock{font-size:12px;font-weight:650}.finding{margin:7px 0 0;line-height:1.35}.hero a,.offer a{display:inline-block;color:#5638a3;font-size:14px;font-weight:650;text-underline-offset:4px;margin-top:12px}.hero a{color:#dccbff}section{margin-top:20px}h3{font-size:22px;letter-spacing:-.045em}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(295px,100%),1fr));gap:10px;margin-top:8px}.offer{background:#fcfbfa;padding:19px 22px;display:flex;align-items:center;border:1px solid #d4d0d8}.offer figure{width:32%;margin-left:10px}.offer img{max-height:122px}.offer h2{font-size:22px;line-height:1.14;letter-spacing:-.045em}.offer .finding{font-size:14px}.note{font-size:14px}.empty{padding:38px;background:#e4deed}.empty h2{font-size:28px}.hero a:focus-visible,.offer a:focus-visible{outline:2px solid currentColor;outline-offset:4px}
@media(max-width:640px){header{padding-block:15px}time{max-width:47%;text-align:right}.headline{margin:21px 0 17px}.hero{flex-direction:column;align-items:stretch;gap:14px}.hero figure{width:90%;align-self:center}.hero img{height:130px}.offer{padding:16px}.price small{font-size:11px}}
.compare{gap:16px}.compare .offer{flex-direction:column-reverse;align-items:stretch;padding:0;overflow:hidden;justify-content:flex-end}.compare .offer figure{width:100%;margin:0;background:#fff}.compare .offer img{width:100%;height:clamp(160px,22vw,285px);max-height:none;padding:18px}.compare .copy{padding:22px;border-top:1px solid #e3dfdc}.compare .price{margin-top:12px}
</style></head><body><header><strong>Nstdata Crawl</strong><time>$asof $time</time></header><main><div class="headline"><h1>$title</h1><p>$scope</p></div>$hero$others$note</main></body></html>
