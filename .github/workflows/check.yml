name: checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm install --prefix "$RUNNER_TEMP/skill-installer" --ignore-scripts --no-audit --no-fund skills@1.7.4
      - run: NSTDATA_SKILLS_CLI="$RUNNER_TEMP/skill-installer/node_modules/skills/bin/cli.mjs" python3 -m unittest discover -s tests -v
      - run: python3 scripts/package.py
